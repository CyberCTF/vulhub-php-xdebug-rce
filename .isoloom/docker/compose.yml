      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s
    depends_on:
      isoloom-probe-amd64:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M
    labels:
