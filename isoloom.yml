# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# PHP XDebug remote debugging RCE (Vulhub, by phith0n and the Vulhub contributors) as an Isoloom spec:
# Vulhub's php/xdebug-rce, vendored in build/xdebug2/app/: the published images
# vulhub/php:7.1-xdebug and vulhub/php:7.4-xdebug with index.php copied in.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: vulhub-php-xdebug-rce

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs:
  CTF_FLAG_MAIN: {}

networks:
  lab: {cidr: 10.60.240.0/24, internet: true}    # XDebug connects back to the player's debugger client

machines:
  xdebug2:
    networks: {lab: 10}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: true
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/xdebug2

  xdebug3:
    networks: {lab: 11}
    resources: {cpus: 1, memory_mb: 256}
    volumes: {ctf: /ctf}     # the flag, written by ctf/flag.sh at every start
    ports:
      web:
        port: 80
        protocol: http
        publish: 8081
    files:
      - path: /run/lab/ctf_flag_main
        input: CTF_FLAG_MAIN
    setup:
      - ctf/flag.sh
    app:
      build: build/xdebug3

checks:
  - name: the XDebug 2 site answers
    http: http://xdebug2/
    wait: 60
  - name: the XDebug 3 site answers
    http: http://xdebug3/
    wait: 60
  - name: both sites run XDebug
    script: checks/xdebug.sh
    wait: 60

message: |
  PHP with XDebug 2 answers at {{ machines.xdebug2.ports.web.url }} and with XDebug 3 at
  {{ machines.xdebug3.ports.web.url }}. Read the xdebug section of phpinfo: where does it connect?
